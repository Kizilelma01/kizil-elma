<!DOCTYPE html>
<html lang="tr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0b0b; color: white; padding: 15px; }
        .card { background: #151515; border: 1px solid #333; border-radius: 15px; }
        .gold { color: #ff9800; font-weight: bold; }
        .form-control { background: #222; border: 1px solid #444; color: white; margin-bottom: 10px; }
        .form-control:focus { background: #2a2a2a; color: white; border-color: #ff9800; box-shadow: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card p-4 shadow-lg">
            <h3 class="gold text-center mb-4">Detaylı Sorgulama</h3>
            <form action="/sorgula" method="POST">
                <input type="text" name="ad" class="form-control" placeholder="Ad">
                <input type="text" name="soyad" class="form-control" placeholder="Soyad">
                <input type="text" name="anne_adi" class="form-control" placeholder="Anne Adı">
                <input type="text" name="baba_adi" class="form-control" placeholder="Baba Adı">
                <input type="date" name="dogum_tarihi" class="form-control" placeholder="Doğum Tarihi">
                
                <div class="row">
                    <div class="col-6">
                        <input type="text" name="il" class="form-control" placeholder="İl">
                    </div>
                    <div class="col-6">
                        <input type="text" name="ilce" class="form-control" placeholder="İlçe">
                    </div>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold mt-3">KRİTERLERE GÖRE SORGULA</button>
            </form>
            <a href="/" class="btn btn-link text-secondary w-100 mt-2">← Panele Dön</a>
        </div>
    </div>
</body>
</html>
