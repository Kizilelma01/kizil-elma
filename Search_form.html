<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { background: #161b22; border: 1px solid #30363d; border-radius: 15px; padding: 30px; width: 100%; max-width: 450px; }
        .form-control { background: #0d1117; border: 1px solid #30363d; color: white; margin-bottom: 10px; border-radius: 8px; font-size: 14px; }
        .flash-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .alert-danger { color: #ff0000 !important; border: 2px solid #ff0000 !important; background: black !important; box-shadow: 0 0 20px #ff0000; font-weight: 900; }
    </style>
</head>
<body>
    <div class="flash-container">{% with m = get_flashed_messages(with_categories=true) %}{% if m %}{% for c, msg in m %}<div class="alert alert-{{c}}">{{msg}}</div>{% endfor %}{% endif %}{% endwith %}</div>

    <div class="box text-center shadow-lg">
        <h3 class="text-warning fw-bold mb-4">{{ baslik }}</h3>
        <form action="/search" method="POST" class="text-start">
            <input type="text" name="ad" class="form-control" placeholder="AD">
            <input type="text" name="soyad" class="form-control" placeholder="SOYAD">
            <input type="text" name="dogum_yeri" class="form-control" placeholder="DOĞUM YERİ">
            <input type="text" name="anne_adi" class="form-control" placeholder="ANNE ADI">
            <input type="text" name="baba_adi" class="form-control" placeholder="BABA ADI">
            <p class="text-muted italic text-center mb-3" style="font-size: 11px;">* tüm alanları doldurmak zorunlu değildir</p>
            <button type="submit" class="btn btn-danger w-100 fw-bold py-2">SORGULA</button>
        </form>
        <div class="mt-4"><a href="/" class="text-info small text-decoration-none">← Ana Menüye Dön</a></div>
    </div>
    <script>setTimeout(function(){ document.querySelectorAll('.alert').forEach(a => a.style.display='none'); }, 3000);</script>
</body>
</html>
