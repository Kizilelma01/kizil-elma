<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Kızıl Elma | Adres Çözümleri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background-color: #0f1216; color: #c9d1d9; }
        .card-sorgu { background: #161b22; border: 1px solid #30363d; border-radius: 15px; }
        .status-msg { position: fixed; top: 70px; right: 20px; padding: 10px 20px; border-radius: 8px; font-weight: bold; z-index: 1000; }
        .msg-found { color: #00d2ff; border: 1px solid #00d2ff; background: rgba(0, 210, 255, 0.1); }
        .msg-not-found { color: #ff4d4d; border: 1px solid #ff4d4d; background: rgba(255, 77, 77, 0.1); }
    </style>
</head>
<body>

{% if sonuclar %}
    <div class="status-msg msg-found">Kayıt Bulundu</div>
{% elif tip %}
    <div class="status-msg msg-not-found">Kayıt Bulunamadı</div>
{% endif %}

<nav class="navbar navbar-dark bg-dark border-bottom border-secondary mb-4">
    <div class="container">
        <a class="navbar-brand text-danger fw-bold" href="/"><i class="fas fa-apple-alt me-2"></i>KIZIL ELMA</a>
        <a href="/" class="btn btn-outline-secondary btn-sm">Panele Dön</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card-sorgu p-4 text-center">
                <i class="fas fa-map-marker-alt fa-3x text-success mb-3"></i>
                <h4>TC -> Adres Sorgu</h4>
                <form action="/sorgula/adres" method="POST" class="mt-3">
                    <input type="text" name="sorgu_input" class="form-control bg-dark text-white mb-3" placeholder="TC Kimlik No Girin" required>
                    <button type="submit" class="btn btn-success w-100 fw-bold">SORGULA</button>
                </form>
            </div>
        </div>

        {% if sonuclar %}
        <div class="col-12 mt-4" id="printArea">
            <div class="card-sorgu p-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5>Adres Sonuçları</h5>
                    <div>
                        <button onclick="pdfIndir()" class="btn btn-sm btn-danger"><i class="fas fa-file-pdf"></i> PDF</button>
                    </div>
                </div>
                <table class="table table-dark table-hover">
                    <thead><tr><th>TC</th><th>Ad Soyad</th><th>Adres</th></tr></thead>
                    <tbody>
                        {% for r in sonuclar %}
                        <tr><td>{{ r.tc }}</td><td>{{ r.ad_soyad }}</td><td>{{ r.adres }}</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        {% endif %}
    </div>
</div>

<script>
    function pdfIndir() {
        const element = document.getElementById('printArea');
        html2pdf().from(element).save('Adres_Sorgu_Sonucu.pdf');
    }
</script>
</body>
</html>
