<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kızıl Elma - Kayıt Düzenle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand text-danger fw-bold" href="/">KIZIL ELMA</a>
    <div class="ms-auto d-flex align-items-center">
      <a href="/" class="btn btn-success btn-sm me-2 fw-bold" style="background-color: #2ecc71; border: none;">ANA SAYFA</a>
      <a href="/admin" class="btn btn-outline-light btn-sm me-2">Veri Ekle</a>
      <a href="/logs" class="btn btn-outline-warning btn-sm me-2">İşlem Geçmişi</a>
      <a href="/logout" class="btn btn-danger btn-sm">Çıkış Yap</a>
    </div>
  </div>
</nav>

<div class="container" style="max-width: 500px;">
    <div class="card shadow-sm p-4">
        <h4 class="text-warning fw-bold mb-4">Kaydı Güncelle</h4>
        <form method="POST">
            <div class="mb-3"><label class="small fw-bold">TC Kimlik</label><input type="text" name="tc" class="form-control" value="{{ row.tc }}" required></div>
            <div class="mb-3"><label class="small fw-bold">Ad Soyad</label><input type="text" name="ad_soyad" class="form-control" value="{{ row.ad_soyad }}" required></div>
            <div class="mb-3"><label class="small fw-bold">İlçe</label><input type="text" name="ilce" class="form-control" value="{{ row.ilce }}"></div>
            <div class="mb-3">
                <label class="small fw-bold">Durum</label>
                <select name="durum" class="form-select">
                    <option value="Aktif" {% if row.durum == 'Aktif' %}selected{% endif %}>Aktif</option>
                    <option value="Beklemede" {% if row.durum == 'Beklemede' %}selected{% endif %}>Beklemede</option>
                    <option value="Pasif" {% if row.durum == 'Pasif' %}selected{% endif %}>Pasif</option>
                </select>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">GÜNCELLEMEYİ KAYDET</button>
            <a href="/" class="btn btn-outline-secondary w-100 mt-2">İptal</a>
        </form>
    </div>
</div>

</body>
</html>
